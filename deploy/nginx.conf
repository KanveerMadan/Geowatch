# Local full stack: static site + same-origin proxy to the API.
server {
    listen 8080;
    root /usr/share/nginx/html;

    location /api/ { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300s; }
    location = /health { proxy_pass http://api:8000; }

    # Hashed assets never change.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

    # The site's routes (/, /explore, /gallery, /honesty) are one page.
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
