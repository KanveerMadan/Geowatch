# Item 21 Phase A — surface-fraction pipeline configuration.
#
# Rules for every number in this file (05_BUILD_MANUAL.md item 21, "Phase A —
# build rulings", 2026-09-25):
#   - A threshold is either CITED (source given) or MEASURED (measurement
#     named), and is marked UNVALIDATED until its own validation case runs.
#   - A threshold with no verified source is UNSET (value: null). The detector
#     or flag that needs it emits status "not_computed". It is never filled in
#     with a guess.
# Dataset IDs below were verified live against Earth Engine on 2026-09-25.

aois:
  # The project's canonical apples-to-apples test AOI (tests/conftest.py,
  # configs/ingestion.yaml test_aoi). Smoke test only -- not a labelling site.
  dharavi:
    bbox: {west: 72.836, south: 19.037, east: 72.862, north: 19.060}
    composite_window: {start: "2024-01-01", end: "2024-03-31"}
    smoke_test: true

sentinel2:
  collection: COPERNICUS/S2_SR_HARMONIZED
  # Scene-level pre-filter, same default as the existing pipeline
  # (configs/ingestion.yaml sentinel2.cloud_cover_threshold).
  cloud_cover_threshold: 20
  # The existing 6-band recipe (ingestion/sentinel2.py S2_BANDS), float32
  # reflectance, never the 8-bit PNG preview (C41).
  resolution_m: 10

temporal_variance:
  # Calendar year of the composite window's end date (Phase A default).
  year_from: composite_end

footprints:
  open_buildings:
    asset: GOOGLE/Research/open-buildings/v3/polygons
    min_confidence: 0.7          # Decision 13 / item 21, signed off
  microsoft:
    # Microsoft Global ML Building Footprints, awesome-gee-community-catalog
    # (sat-io). One table per country; the country is looked up at the AOI
    # centroid in LSIB and spaces become underscores.
    folder: projects/sat-io/open-datasets/MSBuildings
    country_lookup: USDOS/LSIB_SIMPLE/2017
    country_field: country_na
  # Sub-cell size for polygon coverage on the 10 m grid (same as
  # diagnose_pure_pixels.SUBPIXEL_M): 100 sub-cells per pixel.
  subcell_m: 1

dem:
  collection: COPERNICUS/DEM/GLO30_2024_1
  band: DEM

datasets:
  gmw: projects/sat-io/open-datasets/GMW/extent/gmw_v3_2020_vec
  glwd_main_class: projects/sat-io/open-datasets/GLWD/GLWD_V2_DELTA_MAIN_CLASS  # pragma: allowlist secret -- public EE asset path, not a secret
  firms: FIRMS

# OSM layers, fetched only through ingestion/overpass.py. Each group is a list
# of raw Overpass tag filters: clauses within one string are ANDed, strings
# are ORed. `geometry` says how members are rasterised:
#   area          closed ways / multipolygons -> per-pixel covered fraction
#   line          ways -> per-pixel "touched" flag (OSM carries no width)
#   area_or_line  closed -> area, open -> line
# Usage counts checked on taginfo 2026-09-25. Groups with no usable OSM tag
# are listed with filters: [] and status no_producer -- not approximated.
osm_layers:
  sports_field:  {geometry: area, filters: ['["leisure"="pitch"]']}
  golf_course:   {geometry: area, filters: ['["leisure"="golf_course"]']}
  park:          {geometry: area, filters: ['["leisure"="park"]']}
  farmland:      {geometry: area, filters: ['["landuse"="farmland"]']}
  sand:          {geometry: area, filters: ['["natural"="sand"]']}
  rock:          {geometry: area, filters: ['["natural"="bare_rock"]', '["natural"="scree"]']}
  landfill:      {geometry: area, filters: ['["landuse"="landfill"]']}
  quarry:        {geometry: area, filters: ['["landuse"="quarry"]']}
  dirt_track:    {geometry: line, filters: ['["highway"="track"]']}
  unpaved_parking:
    geometry: area
    filters: ['["amenity"="parking"]["surface"~"^(unpaved|dirt|ground|gravel|compacted|earth|sand)$"]']
  pier_quay:     {geometry: area_or_line, filters: ['["man_made"="pier"]', '["man_made"="quay"]']}
  # natural=salt_flat and natural=salt_pan: 0 uses. landuse=salt_pond is
  # flooded evaporation ponds (water), not a salt flat.
  salt_flat:     {geometry: area, filters: [], status: no_producer}
  # natural=dry_lake: 45 uses worldwide. intermittent=yes marks intermittent
  # water, not a dry bed.
  dry_lakebed:   {geometry: area, filters: [], status: no_producer}

# Part 2 — occlusion (Decision 14 observability group; Phase A rulings).
occlusion:
  # Sentinel-2 L2A Scene Classification codes, per the ESA L2A product spec
  # (same codes as ingestion/sentinel2.py SCL_CLASSES). Not thresholds.
  scl_codes:
    nodata: [0, 1]
    cloud: [8, 9, 10]
    snow: [11]
  # One category per observation, first match wins. Only matters for an
  # observation that is two things at once (e.g. cloud over a fire).
  precedence: [nodata, cloud, fire, snow]
  fire:
    collection: FIRMS
    band: T21
    native_resolution_m: 1000
    # FIRMS also carries a `confidence` band. No cut-off is applied: any
    # value would be an uncited threshold. A detection is T21 present.
    confidence_min: null        # UNSET
  shadow_full:
    criterion: null             # UNSET -- full/partial boundary open (Decisions 11/14)

# Part 3 — detectors (Decision 11 producers). Each threshold is
#   {value, source, status}; status is UNVALIDATED (cited or measured, not yet
#   validated) or UNSET (value null). Any UNSET threshold -> the detector
#   emits status "not_computed". Each detector gets its own validation case
#   later (item 21, "Validation additions").
# Detected pixel = fraction 1.0, and detectors override the vegetation and
# water regressors on that pixel: a Phase A simplification, to be revisited
# after each detector's validation case (Phase A ruling, 2026-09-25).
detectors:
  snow_ice:
    # Ruling 2026-09-25 (second round, 1): "excluded" per AOI when a global
    # permanent-snow / glacier dataset shows none. Union: excluded only if
    # EVERY listed dataset shows none (a wrong exclusion pins the fraction to
    # 0, so the conservative direction is to require all to agree).
    exclusion:
      - {id: GLIMS/current, kind: features}              # glacier outlines
      - {id: MODIS/061/MCD12Q1, kind: class_image, band: LC_Type1,
         class_value: 15, class_name: "Permanent Snow and Ice (IGBP)",
         image: latest, scale_m: 463}
    thresholds:
      ndsi_min:
        value: 0.4
        source: "Hall, Riggs & Salomonson (1995), Remote Sensing of Environment 54(2):127-140 -- MODIS snow mapping, NDSI >= 0.4"
        status: UNVALIDATED
      nir_min:
        value: 0.11
        source: "Hall, Riggs & Salomonson (1995), ibid. -- NIR reflectance > 0.11 to exclude water"
        status: UNVALIDATED
      # "Low temporal variance" (Decision 11): no cited or measured cut-off,
      # and no decision on which item 18 variance band carries it.
      variance_band: {value: null, source: null, status: UNSET}
      variance_max: {value: null, source: null, status: UNSET}
  solar:
    # Ground-mounted arrays only (ruling 2026-09-25, 3). Excluded per AOI when
    # NEITHER inventory has an installation intersecting it. Both are
    # utility / commercial scale: small ground-mounted arrays can be missed.
    exclusion:
      - {id: projects/sat-io/open-datasets/TZERO/TZ-SOLAR-2025Q3_ANALYSIS_POLYGONS, kind: features}  # pragma: allowlist secret -- public EE asset path
      - {id: projects/sat-io/open-datasets/GRW/SOLAR_V1, kind: features}
    exclusion_caveat: "inventories are utility/commercial scale; small ground-mounted arrays may be missed"
    thresholds:
      # No verified spectral index or cut-off for photovoltaic panels in
      # Sentinel-2 as of 2026-09-25.
      index: {value: null, source: null, status: UNSET}
      index_min: {value: null, source: null, status: UNSET}
  mixed_water_vegetation:
    thresholds:
      # No verified single spectral criterion covering wetlands, mangroves,
      # mudflats/tidal zones and water hyacinth as of 2026-09-25.
      criterion: {value: null, source: null, status: UNSET}
    sub_typing:
      # Applied only where the detector fires. GMW first (vector,
      # mangrove-specific); else the GLWD v2 main class; else "unattributed".
      # Assets: datasets.gmw and datasets.glwd_main_class above.
      # Legend copied from the GLWD v2 asset's own `description` property
      # (read 2026-09-25). 0 = Dryland (non-wetland).
      glwd_legend:
        0: Dryland
        1: Freshwater lake
        2: Saline lake
        3: Reservoir
        4: Large river
        5: Large estuarine river
        6: Other permanent waterbody
        7: Small streams
        8: Lacustrine, forested
        9: Lacustrine, non-forested
        10: Riverine, regularly flooded, forested
        11: Riverine, regularly flooded, non-forested
        12: Riverine, seasonally flooded, forested
        13: Riverine, seasonally flooded, non-forested
        14: Riverine, seasonally saturated, forested
        15: Riverine, seasonally saturated, non-forested
        16: Palustrine, regularly flooded, forested
        17: Palustrine, regularly flooded, non-forested
        18: Palustrine, seasonally saturated, forested
        19: Palustrine, seasonally saturated, non-forested
        20: Ephemeral, forested
        21: Ephemeral, non-forested
        22: Arctic/boreal peatland, forested
        23: Arctic/boreal peatland, non-forested
        24: Temperate peatland, forested
        25: Temperate peatland, non-forested
        26: Tropical peatland, forested
        27: Tropical peatland, non-forested
        28: Mangrove
        29: Saltmarsh
        30: Delta
        31: Other coastal wetland
        32: Salt pan, saline/brackish wetland
        33: Paddy rice

# Part 5 — PLACEHOLDERS. ███ NOT MEASUREMENTS. ███
# Constants that stand in for the untrained item 21 regressors so the
# pipeline runs end to end. Chosen to be obviously synthetic (uniform over
# the AOI), not plausible. Every output they touch is marked
# provenance "placeholder" / placeholder_tainted, and the run carries
# contains_placeholder: true.
placeholders:
  regressors:
    vegetation: 0.2
    water: 0.1
    impervious_share: 0.5       # share of the hard-surface remainder
  # Stand-in for a not_computed detector. Allowed ONLY in an AOI marked
  # smoke_test: true (Phase A ruling). In any other run, a not_computed
  # detector makes the remainder not_computed.
  detector_smoke_test_value: 0.0

# Part 6 — flags and context layers (Decision 11). Per-pixel, many per AOI.
# Context touches neither the denominator nor any fraction (Decision 14,
# 2026-09-24 extension); the synthetic-turf check alone would be estimate
# quality.
context:
  osm_flags:
    # A pixel is flagged when the OSM layer covers any of it (area layers)
    # or a line touches it (line layers). "Any overlap" is not a tunable
    # threshold; the covered fraction is emitted beside the flag.
    vegetation: [sports_field, golf_course, park, farmland]
    bare: [sand, rock, landfill, quarry, dirt_track, unpaved_parking, salt_flat, dry_lakebed]
    other: [pier_quay]            # piers/quays: context only (Decision 11, 2026-09-25)
  synthetic_turf_check:
    criterion: {value: null, source: null, status: UNSET}
  bare_geographic_plausibility:
    criterion: {value: null, source: null, status: UNSET}
  volcano:
    # Smithsonian GVP "Volcanoes of the World" Holocene list. The GVP site
    # and WFS refused programmatic access on 2026-09-25 (HTTP 403 /
    # connection reset), and no Earth Engine mirror was found. Export the
    # official list (GeoJSON or CSV with Volcano_Number, Volcano_Name,
    # Latitude, Longitude) to this path by hand; until then the layer is
    # "unavailable". No unofficial copy is used.
    gvp_path: data/reference/gvp_holocene_volcanoes.geojson
    # Per-pixel flag needs a radius around the GVP point; none is cited.
    match_radius_m: {value: null, source: null, status: UNSET}
  terrain:
    # flat / hilly / mountainous cut-offs on slope and elevation. None is
    # cited or measured as of 2026-09-25.
    slope_deg_hilly_min: {value: null, source: null, status: UNSET}
    slope_deg_mountainous_min: {value: null, source: null, status: UNSET}
    elevation_m_mountainous_min: {value: null, source: null, status: UNSET}
