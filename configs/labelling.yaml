    frame_sources: {oam: [5dd0f6dda7dadc0006433b5b]}
    validates: [built]                    # built only (pre-registered 2026-09-25)
    frame_basis: data      # measured valid pixels, not the footprint polygon (decided 2026-09-25)
    frame_footprint: {box_share: 0.2506, area_km2: 2.255, tiles_200m: 42}
    frame_data: {box_share: 0.158, area_km2: 1.422, tiles_200m: 22}
