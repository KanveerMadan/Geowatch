# Item 21 Phase A, part 7 — labelling tooling configuration.
# Protocol: LABELLING_GUIDE.md (v1.4, 2026-09-25; v1.0 2026-09-24). Numbers the guide
# fixes are copied here with their section; the five numbers the guide
# leaves OPEN (§9) are UNSET (null). Code that needs an UNSET number refuses
# to run. None of them may be set after labelling begins or after model
# results are seen (§9).

guide_version: "1.4"          # v1.1 solar; v1.2 sun geometry; v1.3 Marrakech removed; v1.4 date ranges

labels:
  scored: [built, paved, vegetation, water, bare, mixed_water_vegetation, snow_ice, solar]
  excluded: [unsure, shadow_full]        # §1, §9.5: out of the cell's denominator
  # shadow_partial is NOT a label (§1): the underlying class + this flag.
  partial_shadow_property: shadow_partial
  # v1.1: rooftop panels are `built` + this flag, never `solar`.
  rooftop_solar_property: rooftop_solar

tiles:
  size_m: 200                 # §3 "~200 m x 200 m"; 20 x 20 Sentinel-2 cells
  strata: [dense_informal, formal, mixed, fringe]      # §3
  # A tile straddling strata goes to the stratum with the largest share of
  # its area; a tie makes it ineligible. Phase A default -- not in the
  # guide; flagged for review.
  stratum_assignment: plurality
  random_seed: 20260925       # recorded in the frame; fixes the order before counts exist

# v1.2 (§5/§8): stand-in for an unpublished acquisition time.
sun_geometry:
  min_buildings: 3                    # "shadows of >= 3 buildings in the tile"

qc:
  blind_relabel_fraction: 0.15        # §7 "~15% of tiles"
  same_labeller_min_gap_days: 7       # §7 "at least one week"

sites:                        # 05_BUILD_MANUAL.md item 21, "Site list — FINAL"
  training: [cape_town, lima, karachi, monrovia]   # marrakech removed 2026-09-25 (no Open Buildings in Morocco)
  validation: [makoko, kibera, rocinha]

# ── §9 OPEN — UNSET. Do not choose these in code. ──────────────────────────
open:
  change_test: {method: null, threshold: null, status: UNSET}          # §9.1
  max_date_gap_days: {status: UNSET, per_site: {}}                     # §9.2
  starting_tile_count: {status: UNSET, per_stratum: {}}                # §9.3
  agreement_bars: {status: UNSET, per_class: {}}                       # §9.4
  max_excluded_share_per_cell: {value: null, status: UNSET}            # §9.5
  # Not one of the five, and also undecided: how many validation tiles go
  # in sealed batch 1 vs batch 2 (§8).
  validation_batch_1_count: {value: null, status: UNSET}

# Ruling 2026-09-25 (second round, 5): label_limited compares LABEL agreement
# (between two labellings) with the MODEL's pass bar for the same quantity.
model_pass_bars:
  # 05_BUILD_MANUAL.md item 21, "Validation criteria and guardrails", fixed
  # 2026-09-24. The FLOORS are the pass/fail line ("failing the floor fails
  # the item"); IoU is diagnostic only and is not a pass bar.
  impervious_total:
    derived_from: [built, paved]          # label fraction = built + paved
    fraction_mae_max: 0.15
    fraction_r2_min: 0.3
    source: "05_BUILD_MANUAL.md item 21, impervious_total pass/fail floors"
  # Decided 2026-09-25 (R5), stricter than impervious_total because paved =
  # impervious_total - built inherits built's error. Polygon IoU diagnostic.
  built:
    fraction_mae_max: 0.10          # per 10 m cell
    fraction_r2_min: 0.5            # per 10 m cell
    coverage_bias_abs_max: 0.05     # per site, |mean(a) - mean(b)|
    source: "05_BUILD_MANUAL.md item 21, `built` pass/fail (R5, 2026-09-25)"

# ── Site AOIs (2026-09-25) ──────────────────────────────────────────────────
# 3 km x 3 km boxes, exact in the site's UTM zone (measurement B proposals,
# experiments/item21_sites/results/aoi_proposals.json).
#   - measurement B runs on the FULL box;
#   - the LABELLING FRAME is box ∩ the chosen scene's footprint, and tiles are
#     drawn only inside it (labelling.tiles.build_frame).
# frame_scene is the imagery source choice -- not made yet (UNSET).
aois:
  makoko:   {status: approved, crs: "EPSG:32631", box_utm: [541879.2, 716534.5, 544879.2, 719534.5], frame_scene: null}
  kibera:   {status: approved, crs: "EPSG:32737", box_utm: [252473.7, 9853449.4, 255473.7, 9856449.4], frame_scene: null}
  rocinha:
    status: approved
    crs: "EPSG:32723"
    box_utm: [678035.1, 7455053.9, 681035.1, 7458053.9]
    frame_scene: null
    # Pre-registered 2026-09-25 (05_BUILD_MANUAL.md item 21, "Rocinha imagery
    # dating"): the IPP mosaic publishes only "1st half 2024".
    imagery_acquisition_range: {start: "2024-01-01", end: "2024-06-30",
                                reason: "IPP Mosaico_2024 publishes only 'Aquisição 1º semestre de 2024'"}
    acquisition_time: sun_geometry_from_shadows      # guide v1.2 §5/§8
    s2_composite_window: {start: "2024-01-01", end: "2024-06-30"}
    date_gap: {rule: worst_case_across_range, computation: PENDING}
  lima:     {status: approved, variant: "B (midpoint of the two prioritised scenes)", crs: "EPSG:32718", box_utm: [288620.5, 8656435.0, 291620.5, 8659435.0], frame_scene: null}
  monrovia: {status: approved, crs: "EPSG:32629", box_utm: [298676.1, 698077.6, 301676.1, 701077.6], frame_scene: null}
  karachi:  {status: approved, note: "centre 67.0016, 24.9614 -- 2 km north of the first Orangi box, to include fringe", crs: "EPSG:32642", box_utm: [296753.3, 2760653.4, 299753.3, 2763653.4], frame_scene: null}
  cape_town:
    status: approved
    note: "Khayelitsha; extent checked via the city MapServer (experiments/item21_sites/results/capetown_extent.json)"
    crs: "EPSG:32734"
    box_utm: [282308.6, 6232511.7, 285308.6, 6235511.7]
    # Chosen 2026-09-25: the 2025Jan city imagery, NOT 2026Jan -- the
    # service states "This is not the final image for 2026."
    frame_scene: "City of Cape Town 'Aerial Imagery 2025Jan' (0.05 m, cityimg.capetown.gov.za MapServer)"
