# Local full-stack test: API + worker + static site, sharing one data volume.
#   GEOWATCH_CODE_COMMIT=$(deploy/code_commit.sh) docker compose up --build
#   open http://localhost:8080
# Secrets come from .env (never committed; copy .env.example) and the Earth
# Engine key file named by GEE_KEY_FILE_HOST, mounted read-only.
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        GEOWATCH_CODE_COMMIT: ${GEOWATCH_CODE_COMMIT:?run with GEOWATCH_CODE_COMMIT=$(deploy/code_commit.sh)}
    env_file: .env
    environment:
      GEE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/ee-key.json
      GEOWATCH_TRUST_PROXY: "1"
    volumes:
      - geowatch-data:/app/data
      - ${GEE_KEY_FILE_HOST:?set GEE_KEY_FILE_HOST in .env}:/run/secrets/ee-key.json:ro
    ports: ["8000:8000"]
    mem_limit: 2g
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      args:
        GEOWATCH_CODE_COMMIT: ${GEOWATCH_CODE_COMMIT}
    command: ["python", "-m", "deploy.worker"]
    env_file: .env
    environment:
      GEE_SERVICE_ACCOUNT_KEY_FILE: /run/secrets/ee-key.json
    volumes:
      - geowatch-data:/app/data
      - ${GEE_KEY_FILE_HOST}:/run/secrets/ee-key.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,sys; p='/app/data/queue/worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
      interval: 60s
    mem_limit: 3g
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on: [api]
    ports: ["8080:8080"]
    restart: unless-stopped

volumes:
  geowatch-data:
